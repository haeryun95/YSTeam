<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>routine-page</title>
    <!-- CSS -->
    <link rel="stylesheet" href="CSS/variables.css">
    <link rel="stylesheet" href="CSS/common.css">
    <link rel="stylesheet" href="CSS/pages/routine.css">
    <!-- google Icons -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&" />
    <!-- JS -->
    <link rel="stylesheet" href="js/app.js">
    <link rel="stylesheet" href="js/pages/routine.js">
    <link rel="stylesheet" href="js/services/routine-service.js">

</head>

<body>
    <!-- Routin Page Main : haje -->
    <div id="app">
        <!-- header -->
        <header id="app-header">
            <div class="month-control">
                <p class="month-label">
                    2026년 08월
                </p>
                <button type="button" class="month-button">
                    <span class="material-symbols-outlined">
                        arrow_drop_down
                    </span>
                </button>
            </div>
        </header>
        <!-- main -->
        <main id="main" class="main">
            <div class="week-view">
                <nav id="week-strip" class="week-strip" aria-label="날짜 선택">
                    <button type="button" class="week-day is-selected" data-action="select-date" data-date="2026-08-10" aria-pressed="true" aria-label="2026년 8월 10일 월요일"><span class="week-day__star" aria-hidden="true"></span><span class="week-day__date">10</span><span class="week-day__label">월</span></button>
                    <button type="button" class="week-day" data-action="select-date" data-date="2026-08-11" aria-pressed="false" aria-label="2026년 8월 11일 화요일"><span class="week-day__star" aria-hidden="true"></span><span class="week-day__date">11</span><span class="week-day__label">화</span></button>
                    <button type="button" class="week-day" data-action="select-date" data-date="2026-08-12" aria-pressed="false" aria-label="2026년 8월 12일 수요일"><span class="week-day__star" aria-hidden="true"></span><span class="week-day__date">12</span><span class="week-day__label">수</span></button>
                    <button type="button" class="week-day" data-action="select-date" data-date="2026-08-13" aria-pressed="false" aria-label="2026년 8월 13일 목요일"><span class="week-day__star" aria-hidden="true"></span><span class="week-day__date">13</span><span class="week-day__label">목</span></button>
                    <button type="button" class="week-day" data-action="select-date" data-date="2026-08-14" aria-pressed="false" aria-label="2026년 8월 14일 금요일"><span class="week-day__star" aria-hidden="true"></span><span class="week-day__date">14</span><span class="week-day__label">금</span></button>
                    <button type="button" class="week-day" data-action="select-date" data-date="2026-08-15" aria-pressed="false" aria-label="2026년 8월 15일 토요일"><span class="week-day__star" aria-hidden="true"></span><span class="week-day__date">15</span><span class="week-day__label">토</span></button>
                    <button type="button" class="week-day" data-action="select-date" data-date="2026-08-16" aria-pressed="false" aria-label="2026년 8월 16일 일요일"><span class="week-day__star" aria-hidden="true"></span><span class="week-day__date">16</span><span class="week-day__label">일</span></button>
                </nav>
            </div>
            <div class="tag-bar">
                <div class="tag-filters">
                    <p>전체</p>
                </div>
                <button type="button" class="tag-manage">
                    <p class="tag-label">태그 관리</p>
                    <span class="material-symbols-outlined">
                        edit
                    </span>
                </button>
            </div>
            <section class="routine-section routine-section-pending">
                <div class="section-pending">
                    <svg class="section-heading__line" viewBox="0 0 372 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 25 H65 L95 5 H372" /></svg>
                    <p class="section-title">미완료</p>
                    <p class="section-count" aria-live="polite" aria-atomic="true">총 <span data-pending-count>4</span>개</p>
                </div>
                <!-- 임시 목록: 추후 Service 데이터로 렌더링 -->
                <ul class="routine-list" id="pending-list">
                    <li class="routine-card" data-routine-id="routine-1">
                        <button type="button" class="routine-card__complete" data-action="complete-routine" aria-label="물 마시기 완료하기">
                            <img class="routine-card__icon" src="assets/icons/routine-icon.png" alt="">
                            <span class="routine-card__title">물 마시기</span>
                            <span class="routine-card__schedule">매일 · 오전</span>
                        </button>
                        <button type="button" class="routine-card__menu" data-action="open-routine-menu" aria-label="물 마시기 더보기"><span aria-hidden="true">···</span></button>
                    </li>
                    <li class="routine-card" data-routine-id="routine-2">
                        <button type="button" class="routine-card__complete" data-action="complete-routine" aria-label="책 읽기 완료하기">
                            <img class="routine-card__icon" src="assets/icons/routine-icon.png" alt="">
                            <span class="routine-card__title">책 읽기</span>
                            <span class="routine-card__schedule">월, 수, 금 · 종일</span>
                        </button>
                        <button type="button" class="routine-card__menu" data-action="open-routine-menu" aria-label="책 읽기 더보기"><span aria-hidden="true">···</span></button>
                    </li>
                    <li class="routine-card" data-routine-id="routine-3">
                        <button type="button" class="routine-card__complete" data-action="complete-routine" aria-label="정기검진 완료하기">
                            <img class="routine-card__icon" src="assets/icons/routine-icon.png" alt="">
                            <span class="routine-card__title">정기검진</span>
                            <span class="routine-card__schedule">매월 1일 · 오후</span>
                        </button>
                        <button type="button" class="routine-card__menu" data-action="open-routine-menu" aria-label="정기검진 더보기"><span aria-hidden="true">···</span></button>
                    </li>
                    <li class="routine-card" data-routine-id="routine-4">
                        <button type="button" class="routine-card__complete" data-action="complete-routine" aria-label="등산 가기 완료하기">
                            <img class="routine-card__icon" src="assets/icons/routine-icon.png" alt="">
                            <span class="routine-card__title">등산 가기</span>
                            <span class="routine-card__schedule">주말 · 종일</span>
                        </button>
                        <button type="button" class="routine-card__menu" data-action="open-routine-menu" aria-label="등산 가기 더보기"><span aria-hidden="true">···</span></button>
                    </li>
                </ul>
            </section>
            <section class="routine-section routine-section-completed">
                <div class="section-completed">
                    <svg class="section-heading__line" viewBox="0 0 372 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 25 H65 L95 5 H372" /></svg>
                    <p class="section-title">완료</p>
                    <p class="section-count" aria-live="polite" aria-atomic="true">총 <span data-completed-count>4</span>개</p>
                    <!-- 펼친 상태: aria-expanded="true", 기호 −. 접힌 상태: false, 기호 +, 목록에 hidden 추가 -->
                    <button
                        type="button"
                        class="section-toggle"
                        data-action="toggle-completed-list"
                        aria-expanded="true"
                        aria-controls="completed-list"
                        aria-label="완료 루틴 목록 접기"
                    >
                        <span class="section-toggle__icon" data-completed-toggle-icon aria-hidden="true">−</span>
                    </button>
                </div>
                <!-- 임시 목록: 추후 Service 데이터로 렌더링 -->
                <ul class="routine-list" id="completed-list">
                    <li class="routine-card" data-routine-id="routine-5">
                        <button type="button" class="routine-card__complete" data-action="uncomplete-routine" aria-label="물 마시기 완료 취소하기">
                            <img class="routine-card__icon" src="assets/icons/routine-icon.png" alt="">
                            <span class="routine-card__title">물 마시기</span>
                            <span class="routine-card__schedule">매일 · 오전</span>
                        </button>
                        <button type="button" class="routine-card__menu" data-action="open-routine-menu" aria-label="물 마시기 더보기"><span aria-hidden="true">···</span></button>
                    </li>
                    <li class="routine-card" data-routine-id="routine-6">
                        <button type="button" class="routine-card__complete" data-action="uncomplete-routine" aria-label="책 읽기 완료 취소하기">
                            <img class="routine-card__icon" src="assets/icons/routine-icon.png" alt="">
                            <span class="routine-card__title">책 읽기</span>
                            <span class="routine-card__schedule">월, 수, 금 · 종일</span>
                        </button>
                        <button type="button" class="routine-card__menu" data-action="open-routine-menu" aria-label="책 읽기 더보기"><span aria-hidden="true">···</span></button>
                    </li>
                    <li class="routine-card" data-routine-id="routine-7">
                        <button type="button" class="routine-card__complete" data-action="uncomplete-routine" aria-label="정기검진 완료 취소하기">
                            <img class="routine-card__icon" src="assets/icons/routine-icon.png" alt="">
                            <span class="routine-card__title">정기검진</span>
                            <span class="routine-card__schedule">매월 1일 · 오후</span>
                        </button>
                        <button type="button" class="routine-card__menu" data-action="open-routine-menu" aria-label="정기검진 더보기"><span aria-hidden="true">···</span></button>
                    </li>
                    <li class="routine-card" data-routine-id="routine-8">
                        <button type="button" class="routine-card__complete" data-action="uncomplete-routine" aria-label="등산 가기 완료 취소하기">
                            <img class="routine-card__icon" src="assets/icons/routine-icon.png" alt="">
                            <span class="routine-card__title">등산 가기</span>
                            <span class="routine-card__schedule">주말 · 종일</span>
                        </button>
                        <button type="button" class="routine-card__menu" data-action="open-routine-menu" aria-label="등산 가기 더보기"><span aria-hidden="true">···</span></button>
                    </li>
                </ul>
            </section>
        </main>
        <!-- nav bottom -->
        <nav id="nav-bottom"></nav>
    </div>
</body>

</html>
